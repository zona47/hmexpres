# =============================================================================
# Configuración de Netlify — sitio estático, sin proceso de build
# =============================================================================

[build]
  # No hay build: se publica la carpeta de la aplicación tal cual está.
  # El generador queda en la raíz del sitio; la tarjeta digital tiene su
  # propio sitio aparte y no se publica desde aquí.
  publish = "generador-promesas"
  command = ""

# -----------------------------------------------------------------------------
# Cabeceras de seguridad para todo el sitio
# -----------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    # La app trabaja en local; la única salida permitida es la API de Gemini,
    # y solo cuando el usuario carga su propia clave. Ningún otro destino es posible.
    # 'unsafe-inline' es necesario porque el CSS y el JS van embebidos en el HTML.
    Content-Security-Policy = "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src https://generativelanguage.googleapis.com; form-action 'none'; base-uri 'none'; frame-ancestors 'none'"

# -----------------------------------------------------------------------------
# Caché: el HTML debe revalidarse para que tus cambios se vean al instante
# -----------------------------------------------------------------------------
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
